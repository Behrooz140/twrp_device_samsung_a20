name: Build TWRP (a20)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch (twrp-12.1 or twrp-11)'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-8-jdk git-lfs repo || true
          # Fallback: ensure repo tool is available
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
            chmod a+x "$HOME/bin/repo"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          git lfs install

      - name: Initialize and sync TWRP source
        env:
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -euo pipefail
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Place device tree
        run: |
          set -euo pipefail
          mkdir -p ~/twrp/device/samsung
          rm -rf ~/twrp/device/samsung/a20
          cp -a "$GITHUB_WORKSPACE/device-tree/device/samsung/a20" ~/twrp/device/samsung/a20
          echo "Device tree placed at ~/twrp/device/samsung/a20"
          ls -la ~/twrp/device/samsung/a20

      - name: Build recovery image
        working-directory: /home/runner/twrp
        run: |
          set -eo pipefail
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_a20-eng
          mka recoveryimage -j"$(nproc --all)"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          OUT=~/twrp/out/target/product/a20
          mkdir -p artifacts
          if [ -f "$OUT/recovery.img" ]; then cp "$OUT/recovery.img" artifacts/; fi
          if [ -f "$OUT/ramdisk-recovery.cpio" ]; then cp "$OUT/ramdisk-recovery.cpio" artifacts/; fi
          if [ -f "$OUT/recovery.tar" ]; then cp "$OUT/recovery.tar" artifacts/; fi
          # Some builds may name output differently
          find "$OUT" -maxdepth 1 -type f \( -name '*recovery*.img' -o -name '*recovery*.tar' -o -name '*recovery*.zip' \) -exec cp -n {} artifacts/ \; || true
          ls -lh artifacts

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a20-${{ inputs.manifest_branch }}
          path: artifacts/*
          if-no-files-found: error
